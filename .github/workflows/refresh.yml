name: Refresh Dzen feed on Vercel

# Сборка и отдача сайта живут на Vercel (Git-интеграция собирает на каждый push).
# Здесь только расписание: дёргаем Vercel Deploy Hook каждые 6 часов, чтобы Vercel
# пересобрал сайт и подтянул свежие посты Дзена (npm run sync:dzen внутри сборки).

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel rebuild via Deploy Hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret not set yet - skipping (configure it after Vercel import)"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" >/dev/null
          echo "Vercel rebuild triggered"
